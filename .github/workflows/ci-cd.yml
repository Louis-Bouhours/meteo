name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-checks:
    name: "🧪 Quality Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.7.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    name: "🚀 Deploy to VPS"
    needs: quality-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_ROOT="/home/apps/meteo"
            REPO_DIR="$APP_ROOT/repo"
            GIT_REPO="https://github.com/${{ github.repository }}.git"

            echo "==== Deployment start $(date -u) ===="
            echo "Target root: $APP_ROOT"

            # 1. Préparation dossier
            if [ ! -d "$APP_ROOT" ]; then
              echo "📂 Creating $APP_ROOT"
              mkdir -p "$APP_ROOT"
            fi

            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "⬇️ Cloning repository (fresh)"
              rm -rf "$REPO_DIR"
              git clone "$GIT_REPO" "$REPO_DIR"
            else
              echo "🔄 Updating repository"
              cd "$REPO_DIR"
              git fetch --all --prune
              git reset --hard origin/main
            fi

            cd "$REPO_DIR"

            # =========================================================
            # MODE 1: Docker (actuel) - conserve ton docker-compose
            # =========================================================
            if [ -f docker-compose.yml ] || [ -f compose.yml ]; then
              echo "🐳 Docker mode detected"
              if command -v docker compose >/dev/null 2>&1; then
                DC="docker compose"
              else
                DC="docker-compose"
              fi

              # Stop & rebuild
              $DC down || true
              $DC build --pull
              $DC up -d

              echo "🐳 Active containers:"
              $DC ps
            else
              echo "⚠️ Aucun docker-compose.yml trouvé. (Si tu veux utiliser Docker, ajoute-le.)"
            fi

            # =========================================================
            # MODE 2 (OPTIONNEL): Build statique Vite + Caddy
            # Dé-commente si tu passes en mode statique
            # =========================================================
            # echo "📦 Installing dependencies (prod build)..."
            # npm ci
            # echo "🏗 Building Vite app..."
            # npm run build
            # mkdir -p "$APP_ROOT/dist"
            # rsync -a --delete dist/ "$APP_ROOT/dist/"
            # echo "🔁 Reloading Caddy (si nécessaire)..."
            # sudo systemctl reload caddy || true

            echo "✅ Deployment finished $(date -u)"