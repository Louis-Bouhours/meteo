name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-checks:
    name: "🧪 Quality Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.7.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    name: "🚀 Deploy to VPS"
    needs: quality-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # --- Variables ---
            PROJECT_DIR="/var/www/meteo"
            GIT_REPO="https://github.com/${{ github.repository }}.git"
            CONTAINER_NAME="meteo-app"
            IMAGE_NAME="meteo-image"
            
            # --- Logique de Déploiement ---
            echo "Starting deployment for 'meteo' project..."
            
            # Vérifie et clone/pull le code source
            if [ -d "$PROJECT_DIR" ]; then
              cd $PROJECT_DIR
              git pull origin main
            else
              mkdir -p /var/www
              cd /var/www
              git clone $GIT_REPO meteo
              cd $PROJECT_DIR
            fi
            
            echo "🐳 Building and running Docker container..."
            cd $PROJECT_DIR
            
            # Construire la nouvelle image Docker
            docker build -t $IMAGE_NAME .
            
            # Arrêter et supprimer l'ancien conteneur s'il existe
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
            
            # Lancer un nouveau conteneur avec la nouvelle image
            docker run -d -p 3000:3000 --name $CONTAINER_NAME --restart always $IMAGE_NAME
            
            echo "🚀 Deployment finished successfully!"